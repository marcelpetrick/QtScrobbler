name: Release

# Releases only publish commits that CI already qualified. The complete quality gate
# (static analysis, sanitizers, coverage and native mutation testing) runs in CI on
# main; this workflow repeats only the build and unit tests, then publishes Linux
# x86-64 binaries (tar.gz and AppImage) with evidence-based release notes.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v0.13.69'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Linux release (Ubuntu 24.04 / Qt 6.12.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify tag, source version and passed CI
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Not a release tag: $TAG" >&2; exit 1 ;; esac
          VER="${TAG#v}"
          SOURCE_VER=$(sed -n 's/^#define CLIENT_VERSION "\([^"]*\)".*/\1/p' src/lib/common.h)
          if [ "$VER" != "$SOURCE_VER" ]; then
            echo "Tag $TAG does not match source version $SOURCE_VER" >&2
            exit 1
          fi
          SHA=$(git rev-parse HEAD)
          # The CI workflow on main is the full quality gate; require its success here.
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "No successful CI run for $SHA; release only commits that passed CI on main." >&2
            exit 1
          fi
          RUN="https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          echo "Qualified by $RUN"
          # The qualifying run's reports provide the list of checks in the release notes.
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name quality-reports --dir "$RUNNER_TEMP/ci-reports"
          REPORTS=$(dirname "$(find "$RUNNER_TEMP/ci-reports" -path '*build-reports/summary.txt' -print -quit)")
          if [ ! -f "$REPORTS/summary.txt" ]; then
            echo "Qualifying CI run $RUN_ID has no quality report summary" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VER"
            echo "sha=$SHA"
            echo "ci_run=$RUN"
            echo "ci_reports=$REPORTS"
            echo "archive=qtscrobbler-${VER}-linux-x86_64"
          } >> "$GITHUB_OUTPUT"

      - name: Install Python 3.15.2
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
          check-latest: false

      - name: Install system dependencies (non-Qt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config libgl-dev libmtp-dev xvfb iproute2 util-linux dbus \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libfuse2t64 file xauth

      - name: Install verified CMake and CTest 4.5.0
        run: |
          python3 tools/install_cmake.py --prefix "$RUNNER_TEMP/qtscrobbler-cmake"
          echo "$RUNNER_TEMP/qtscrobbler-cmake/bin" >> "$GITHUB_PATH"

      - name: Install Qt 6.12.0
        id: qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase qtdeclarative qttools qttranslations icu
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.4'
          setup-python: false
          cache: true

      - name: Install and test pinned zlib 1.4
        run: |
          python3 tools/install_zlib.py --prefix "$RUNNER_TEMP/qtscrobbler-zlib"
          echo "ZLIB_ROOT=$RUNNER_TEMP/qtscrobbler-zlib" >> "$GITHUB_ENV"

      - name: Allow unprivileged user namespaces for offline test isolation
        # Ubuntu 24.04 runners restrict them via AppArmor; tools/run_offline.py needs
        # user, network, PID and mount namespaces and fails closed without them.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --net --pid --fork --mount-proc true

      - name: Build and run the unit tests
        id: pipeline
        env:
          QTSCROBBLER_QT_PREFIX: ${{ steps.qt.outputs.qt-root-dir }}
          QTSCROBBLER_JOBS: '4'
        run: |
          set -o pipefail
          trap 'mkdir -p build-reports; cp "$RUNNER_TEMP/pipeline.log" build-reports/pipeline.log' EXIT
          ./localPipeline.sh --quick --noRun --noOpen --report-dir build-reports 2>&1 | tee "$RUNNER_TEMP/pipeline.log"

      - name: Strip and package release binaries
        id: pkg
        env:
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          strip --strip-unneeded build/qtscrob build/scrobbler
          mkdir -p "dist/$ARCHIVE/examples"
          cp build/qtscrob build/scrobbler README.md LICENSE COPYING "dist/$ARCHIVE/"
          cp examples/scrobble.log examples/README.md "dist/$ARCHIVE/examples/"
          cp -R documents "dist/$ARCHIVE/"
          tar -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          SHA=$(sha256sum "dist/$ARCHIVE.tar.gz" | awk '{print $1}')
          echo "$SHA  $ARCHIVE.tar.gz" > "dist/$ARCHIVE.tar.gz.sha256"
          {
            echo "archive_path=dist/$ARCHIVE.tar.gz"
            echo "sha256=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Download pinned AppImage tools
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          cd "$RUNNER_TEMP/appimage-tools"
          curl -sSfL --retry 3 -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -sSfL --retry 3 -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c <<'SUMS'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage
          SUMS
          chmod +x ./*.AppImage

      - name: Build the AppImage
        id: appimage
        env:
          QMAKE: ${{ steps.qt.outputs.qt-root-dir }}/bin/qmake
          LINUXDEPLOY: ${{ runner.temp }}/appimage-tools/linuxdeploy-x86_64.AppImage
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          APPIMAGE=$(tools/build_appimage.sh build dist "$VERSION" | tail -n 1)
          sha256sum "$APPIMAGE" | sed 's#  dist/#  #' > "$APPIMAGE.sha256"
          echo "path=$APPIMAGE" >> "$GITHUB_OUTPUT"

      - name: Check extracted release entry points
        env:
          ARCHIVE: ${{ steps.meta.outputs.archive }}
          QT_QPA_PLATFORM: offscreen
        run: |
          PACKAGE_DIR=$(mktemp -d)
          trap 'rm -rf "$PACKAGE_DIR"' EXIT
          tar -xzf "dist/$ARCHIVE.tar.gz" -C "$PACKAGE_DIR"
          timeout 5 "$PACKAGE_DIR/$ARCHIVE/scrobbler" --help
          timeout 5 "$PACKAGE_DIR/$ARCHIVE/qtscrob" --help
          test -s "$PACKAGE_DIR/$ARCHIVE/LICENSE"
          test -s "$PACKAGE_DIR/$ARCHIVE/examples/scrobble.log"
          # The AppImage must start without any Qt installation on the library path.
          # Use the bundled xcb platform plugin under Xvfb, as on a real desktop.
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM APPIMAGE_EXTRACT_AND_RUN=1 \
            timeout 30 xvfb-run -a "${{ steps.appimage.outputs.path }}" --help | tee "$RUNNER_TEMP/appimage-help.txt"
          grep -q "QTScrob (v${{ steps.meta.outputs.version }})" "$RUNNER_TEMP/appimage-help.txt"

      - name: Write release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          CI_RUN: ${{ steps.meta.outputs.ci_run }}
          CI_REPORTS: ${{ steps.meta.outputs.ci_reports }}
          ARCHIVE: ${{ steps.pkg.outputs.archive_path }}
          APPIMAGE: ${{ steps.appimage.outputs.path }}
        run: |
          TESTS=$(grep -oE '[0-9]+% tests passed, [0-9]+ tests failed out of [0-9]+|100% tests passed out of [0-9]+' \
            build-reports/ctest.log | tail -n 1)
          python3 tools/release_notes.py --version "$VERSION" --commit "$SHA" --ci-run "$CI_RUN" \
            --ci-reports "$CI_REPORTS" --release-tests "unit tests on the release build: $TESTS" \
            --asset "$APPIMAGE" --asset "$ARCHIVE" --output release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: QtScrobbler ${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          files: |
            ${{ steps.appimage.outputs.path }}
            ${{ steps.appimage.outputs.path }}.sha256
            ${{ steps.pkg.outputs.archive_path }}
            ${{ steps.pkg.outputs.archive_path }}.sha256
          fail_on_unmatched_files: true

      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs
          path: |
            build-reports/
            release-notes.md
          retention-days: 30
          if-no-files-found: warn
