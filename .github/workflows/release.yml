name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Qualified Linux release (Ubuntu 24.04 / Qt 6.12.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (non-Qt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config python3 python3-venv \
            libgl-dev libmtp-dev zlib1g-dev libarchive-tools \
            clazy cppcheck doxygen graphviz shellcheck xvfb

      - name: Install verified CMake and CTest 4.5.0
        run: |
          python3 tools/install_cmake.py --prefix "$RUNNER_TEMP/qtscrobbler-cmake"
          echo "$RUNNER_TEMP/qtscrobbler-cmake/bin" >> "$GITHUB_PATH"

      - name: Install Qt 6.12.0
        id: qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase qtdeclarative qttools qttranslations icu
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.4'
          setup-python: false
          cache: true

      - name: Verify source version matches release tag
        id: meta
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          SOURCE_VER=$(sed -n 's/^#define CLIENT_VERSION "\([^"]*\)".*/\1/p' src/lib/common.h)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VER="$SOURCE_VER"
            TAG="v$VER"
          fi
          if [ "$VER" != "$SOURCE_VER" ]; then
            echo "Tag $TAG does not match source version $SOURCE_VER" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VER"
            echo "archive=qtscrobbler-${VER}-linux-x86_64"
          } >> "$GITHUB_OUTPUT"

      - name: Install locked quality tools
        run: |
          python3 -m venv "$RUNNER_TEMP/qtscrobbler-quality-tools"
          "$RUNNER_TEMP/qtscrobbler-quality-tools/bin/python" -m pip install -r requirements-quality.txt
          echo "$RUNNER_TEMP/qtscrobbler-quality-tools/bin" >> "$GITHUB_PATH"

      - name: Install qualified native LLVM and Mull
        run: |
          python3 tools/install_mutation_toolchain.py --prefix "$RUNNER_TEMP/qtscrobbler-native-tools"
          echo "$RUNNER_TEMP/qtscrobbler-native-tools/usr/bin" >> "$GITHUB_PATH"
          {
            echo "CC=$RUNNER_TEMP/qtscrobbler-native-tools/usr/bin/clang-20"
            echo "CXX=$RUNNER_TEMP/qtscrobbler-native-tools/usr/bin/clang++-20"
            echo "QTSCROBBLER_LLVM_PREFIX=$RUNNER_TEMP/qtscrobbler-native-tools"
            echo "QTSCROBBLER_MULL_PLUGIN=$RUNNER_TEMP/qtscrobbler-native-tools/usr/lib/mull-ir-frontend-20"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/qtscrobbler-native-tools/usr/lib/x86_64-linux-gnu:$RUNNER_TEMP/qtscrobbler-native-tools/usr/lib/llvm-20/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Install and test pinned zlib 1.4
        run: |
          python3 tools/install_zlib.py --prefix "$RUNNER_TEMP/qtscrobbler-zlib"
          echo "ZLIB_ROOT=$RUNNER_TEMP/qtscrobbler-zlib" >> "$GITHUB_ENV"

      - name: Run the local quality pipeline
        id: pipeline
        env:
          QTSCROBBLER_QT_PREFIX: ${{ steps.qt.outputs.qt-root-dir }}
          QTSCROBBLER_JOBS: '4'
        run: |
          set -o pipefail
          mkdir -p build-reports
          ./localPipeline.sh --noRun --noOpen --report-dir build-reports 2>&1 | tee build-reports/pipeline.log

      - name: Strip and package release binaries
        id: pkg
        env:
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          strip --strip-unneeded build/qtscrob build/scrobbler
          mkdir -p "dist/$ARCHIVE/examples"
          cp build/qtscrob build/scrobbler README.md LICENSE COPYING "dist/$ARCHIVE/"
          cp examples/scrobble.log examples/README.md "dist/$ARCHIVE/examples/"
          cp -R documents "dist/$ARCHIVE/"
          tar -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          SHA=$(sha256sum "dist/$ARCHIVE.tar.gz" | awk '{print $1}')
          {
            echo "archive_path=dist/$ARCHIVE.tar.gz"
            echo "sha256=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check extracted release entry points
        id: package_check
        env:
          ARCHIVE: ${{ steps.meta.outputs.archive }}
          QT_QPA_PLATFORM: offscreen
        run: |
          PACKAGE_DIR=$(mktemp -d)
          trap 'rm -rf "$PACKAGE_DIR"' EXIT
          tar -xzf "dist/$ARCHIVE.tar.gz" -C "$PACKAGE_DIR"
          timeout 5 "$PACKAGE_DIR/$ARCHIVE/scrobbler" --help
          timeout 5 "$PACKAGE_DIR/$ARCHIVE/qtscrob" --help
          test -s "$PACKAGE_DIR/$ARCHIVE/LICENSE"
          test -s "$PACKAGE_DIR/$ARCHIVE/examples/scrobble.log"

      - name: Record actual pipeline and package results
        if: always()
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          PACKAGE_OUTCOME: ${{ steps.pkg.outcome }}
          PACKAGE_CHECK_OUTCOME: ${{ steps.package_check.outcome }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE_SHA256: ${{ steps.pkg.outputs.sha256 }}
        run: |
          {
            echo "# QtScrobbler $RELEASE_VERSION release qualification"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Pipeline step: $PIPELINE_OUTCOME"
            echo "Package step: $PACKAGE_OUTCOME"
            echo "Extracted entry-point checks: $PACKAGE_CHECK_OUTCOME"
            echo
            if [ -n "$ARCHIVE_SHA256" ]; then
              echo "Archive SHA-256: $ARCHIVE_SHA256"
              echo
            fi
            if [ -f build-reports/pipeline.log ]; then
              echo 'Actual local pipeline output:'
              echo '```text'
              tail -n 35 build-reports/pipeline.log
              echo '```'
            else
              echo 'The pipeline did not run; inspect the dependency and version verification steps.'
            fi
            echo
            echo 'The binaries require Qt >= 6.12 and libmtp at runtime. Qt plugins and shared libraries are not bundled.'
            echo 'See the dependency inventory and README for SDK provisioning; older distribution Qt packages are insufficient.'
          } > build-report.md
          cat build-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-quality-reports
          path: |
            build-report.md
            build-reports/
          retention-days: 90
          if-no-files-found: error

      - name: Upload qualified archive
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-linux-release
          path: dist/*.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: QtScrobbler ${{ steps.meta.outputs.version }}
          body_path: build-report.md
          files: |
            ${{ steps.pkg.outputs.archive_path }}
            build-reports/junit.xml
            build-reports/pipeline.log
          fail_on_unmatched_files: true
