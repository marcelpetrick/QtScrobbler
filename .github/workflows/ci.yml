name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Local quality pipeline (Ubuntu 24.04 / Qt 6.12.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.15.2
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
          architecture: x64
          check-latest: false

      - name: Install Ubuntu build and runtime dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential pkg-config python3 python3-venv \
            libgl-dev libegl1 libmtp-dev zlib1g-dev libarchive-tools ninja-build \
            doxygen graphviz shellcheck xvfb xauth bison flex iproute2 util-linux dbus \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 \
            libxcb-render0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-util1 libxcb-xkb1

      - name: Install verified pkgconf and Graphviz
        run: |
          python3 tools/install_aux_tools.py --prefix "$RUNNER_TEMP/qtscrobbler-aux-tools"
          echo "$RUNNER_TEMP/qtscrobbler-aux-tools/bin" >> "$GITHUB_PATH"

      - name: Install verified CMake and CTest 4.5.1
        run: |
          python3 tools/install_cmake.py --prefix "$RUNNER_TEMP/qtscrobbler-cmake"
          echo "$RUNNER_TEMP/qtscrobbler-cmake/bin" >> "$GITHUB_PATH"

      - name: Build checksum-verified Cppcheck 2.22.0
        run: |
          tools/install_cppcheck.sh "$RUNNER_TEMP/qtscrobbler-cppcheck" "$RUNNER_TEMP/qtscrobbler-cppcheck-reports"
          echo "$RUNNER_TEMP/qtscrobbler-cppcheck/bin" >> "$GITHUB_PATH"

      - name: Install locked Python tools
        run: |
          tools="$RUNNER_TEMP/qtscrobbler-quality-tools"
          python3 -m venv "$tools"
          "$tools/bin/python" -m pip install --no-deps -r requirements-bootstrap.txt
          "$tools/bin/python" -m pip install --no-deps --no-build-isolation -r requirements-quality.txt
          "$tools/bin/python" -m pip check
          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Install checksum-verified Qt 6.12.1
        id: qt
        run: |
          tools/install_qt_sdk.sh "$RUNNER_TEMP/qtscrobbler-qt" "$RUNNER_TEMP/dependency-reports"
          echo "qt-root-dir=$RUNNER_TEMP/qtscrobbler-qt/6.12.1/gcc_64" >> "$GITHUB_OUTPUT"

      - name: Install qualified native LLVM and Mull
        run: |
          python3 tools/install_mutation_toolchain.py --prefix "$RUNNER_TEMP/qtscrobbler-native-tools"
          echo "$RUNNER_TEMP/qtscrobbler-native-tools/usr/bin" >> "$GITHUB_PATH"
          {
            echo "CC=$RUNNER_TEMP/qtscrobbler-native-tools/usr/bin/clang-20"
            echo "CXX=$RUNNER_TEMP/qtscrobbler-native-tools/usr/bin/clang++-20"
            echo "QTSCROBBLER_LLVM_PREFIX=$RUNNER_TEMP/qtscrobbler-native-tools"
            echo "QTSCROBBLER_MULL_PLUGIN=$RUNNER_TEMP/qtscrobbler-native-tools/usr/lib/mull-ir-frontend-20"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/qtscrobbler-native-tools/usr/lib/x86_64-linux-gnu:$RUNNER_TEMP/qtscrobbler-native-tools/usr/lib/llvm-20/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Build checksum-verified Clazy 1.17.1 with LLVM 20.1.8
        run: |
          tools/install_clazy.sh "$QTSCROBBLER_LLVM_PREFIX" \
            "$RUNNER_TEMP/qtscrobbler-clazy" "$RUNNER_TEMP/qtscrobbler-clazy-reports"
          echo "$RUNNER_TEMP/qtscrobbler-clazy/bin" >> "$GITHUB_PATH"
          resource_dir=$("$CC" --print-resource-dir)
          test -d "$resource_dir/include"
          echo "QTSCROBBLER_CLAZY_EXTRA_ARGS=-resource-dir=$resource_dir" >> "$GITHUB_ENV"

      - name: Install verified native call-removal correction
        run: |
          python3 tools/install_mull_callfix.py \
            --toolchain-prefix "$RUNNER_TEMP/qtscrobbler-native-tools" \
            --prefix "$RUNNER_TEMP/qtscrobbler-mull-callfix"
          {
            echo "CXX=$RUNNER_TEMP/qtscrobbler-mull-callfix/bin/clang++-20-callfix"
            echo "QTSCROBBLER_MULL_CALLFIX_MANIFEST=$RUNNER_TEMP/qtscrobbler-mull-callfix/mull-callfix-manifest.json"
            echo "QTSCROBBLER_MULL_CALLFIX_SHIM=$RUNNER_TEMP/qtscrobbler-mull-callfix/lib/libmull-callfix.so"
            echo "QTSCROBBLER_MULL_CALLFIX_SOURCE=$RUNNER_TEMP/qtscrobbler-mull-callfix/native/void_call_fix.cpp"
          } >> "$GITHUB_ENV"

      - name: Install and test pinned zlib 1.4
        run: |
          python3 tools/install_zlib.py --prefix "$RUNNER_TEMP/qtscrobbler-zlib"
          echo "ZLIB_ROOT=$RUNNER_TEMP/qtscrobbler-zlib" >> "$GITHUB_ENV"

      - name: Allow unprivileged user namespaces for offline test isolation
        # Ubuntu 24.04 runners restrict them via AppArmor; tools/run_offline.py needs
        # user, network, PID and mount namespaces and fails closed without them.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --net --pid --fork --mount-proc true

      - name: Record actual runner dependencies
        run: tools/record_runner_dependencies.sh "$RUNNER_TEMP/dependency-reports"

      - name: Run the local quality pipeline
        id: pipeline
        env:
          QTSCROBBLER_QT_PREFIX: ${{ steps.qt.outputs.qt-root-dir }}
          QTSCROBBLER_JOBS: '4'
        run: |
          set -o pipefail
          trap 'mkdir -p build-reports; cp "$RUNNER_TEMP/pipeline.log" build-reports/pipeline.log' EXIT
          ./localPipeline.sh --noRun --noOpen --report-dir build-reports 2>&1 | tee "$RUNNER_TEMP/pipeline.log"

      - name: Record actual pipeline results
        if: always()
        run: |
          {
            echo '# QtScrobbler quality pipeline'
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            if [ -f build-reports/pipeline.log ]; then
              echo 'The following is the actual local pipeline output, including failures:'
              echo '```text'
              tail -n 35 build-reports/pipeline.log
              echo '```'
            else
              echo 'The pipeline did not run; inspect the dependency installation steps.'
            fi
          } > build-report.md
          cat build-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            build-report.md
            build-reports/
            ${{ runner.temp }}/dependency-reports/
            ${{ runner.temp }}/qtscrobbler-zlib-reports/
            ${{ runner.temp }}/qtscrobbler-aux-tools-reports/
            ${{ runner.temp }}/qtscrobbler-clazy-reports/
            ${{ runner.temp }}/qtscrobbler-cppcheck-reports/
          retention-days: 30
          if-no-files-found: error

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-linux-x86_64
          path: |
            build/qtscrob
            build/scrobbler
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows package (Windows Server 2025 / Qt 6.12.1 MinGW)
    runs-on: windows-2025
    # A modal Qt error dialog would otherwise block until the default job limit.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python 3.15.2
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
          architecture: x64
          check-latest: false

      - name: Install verified CMake and CTest 4.5.1
        run: |
          python tools/install_cmake.py --prefix "$RUNNER_TEMP/qtscrobbler-cmake"
          echo "$RUNNER_TEMP/qtscrobbler-cmake/bin" >> "$GITHUB_PATH"

      - name: Install checksum-verified Qt 6.12.1 MinGW and MinGW 15.1
        run: python tools/install_qt_sdk_windows.py --dest "$RUNNER_TEMP/qtscrobbler-qt"

      - name: Install and test pinned zlib 1.4
        env:
          CMAKE_GENERATOR: MinGW Makefiles
          CC: gcc
        run: |
          MINGW_BIN=$(cygpath -u "$RUNNER_TEMP/qtscrobbler-qt/Tools/mingw1510_64/bin")
          export PATH="$MINGW_BIN:$PATH"
          python tools/install_zlib.py --prefix "$RUNNER_TEMP/qtscrobbler-zlib" \
            --cmake "$RUNNER_TEMP/qtscrobbler-cmake/bin/cmake.exe"

      - name: Build, test, package and smoke-test the Windows ZIP
        id: package
        env:
          QTSCROBBLER_JOBS: '4'
        run: |
          VERSION=$(sed -n 's/^#define CLIENT_VERSION "\([^"]*\)".*/\1/p' src/lib/common.h)
          ZIP=$(tools/build_windows_package.sh "$RUNNER_TEMP/qtscrobbler-qt/6.12.1/mingw_64" \
            "$RUNNER_TEMP/qtscrobbler-qt/Tools/mingw1510_64/bin" "$RUNNER_TEMP/qtscrobbler-zlib" \
            "$VERSION" dist | tail -n 1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload the Windows package
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          retention-days: 7
          if-no-files-found: error
